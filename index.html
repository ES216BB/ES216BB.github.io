<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website - Cloud Save</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --accent-color: #4a90e2;
            --card-bg: #ffffff;
        }
        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #f4f7f6;
            --accent-color: #357abd;
            --card-bg: #2a2a2a;
        }
        body { font-family: system-ui, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; }
        header, main { max-width: 800px; margin: 0 auto; padding: 2rem 1rem; }
        .profile-card { background-color: var(--card-bg); padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 2rem; }
        .upload-container { border: 3px dashed var(--accent-color); padding: 2rem; text-align: center; border-radius: 8px; background-color: rgba(74, 144, 226, 0.05); cursor: pointer; }
        .file-input { display: none; }
        #preview-container { margin-top: 1.5rem; text-align: center; }
        #image-preview { max-width: 100%; max-height: 300px; border-radius: 8px; display: none; }
        .btn { background-color: #2ecc71; color: white; border: none; padding: 0.7rem 1.5rem; border-radius: 20px; cursor: pointer; font-weight: bold; margin-top: 1rem; display: none; }
        #status-message { margin-top: 1rem; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div><strong>MySpace Storage</strong></div>
    </header>

    <main>
        <section class="profile-card">
            <h1>Upload & Save to Cloud ☁️</h1>
            <p>Upload your file and click save to permanently store it in the database cloud folder.</p>
            
            <div class="upload-container" onclick="triggerUpload()">
                <p>Click to browse and choose a file</p>
                <input type="file" id="filePicker" class="file-input" accept="image/*">
            </div>

            <div id="preview-container">
                <p id="file-info"></p>
                <img id="image-preview" src="#" alt="Preview">
                <br>
                <button id="saveButton" class="btn" onclick="saveToCloud()">Save Permanently</button>
                <p id="status-message"></p>
            </div>
        </section>
    </main>

    <script>
        const filePicker = document.getElementById('filePicker');
        const imagePreview = document.getElementById('image-preview');
        const fileInfo = document.getElementById('file-info');
        const saveButton = document.getElementById('saveButton');
        const statusMessage = document.getElementById('status-message');
        let selectedFile = null;

        // AUTOMATIC CONFIGURATION USING YOUR PROJECT ID
        const SUPABASE_URL = "

        "; 
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY"; // <-- PASTE YOUR ANON KEY HERE

        function triggerUpload() {
            filePicker.click();
        }

        filePicker.addEventListener('change', function(event) {
            selectedFile = event.target.files[0];
            if (selectedFile) {
                fileInfo.textContent = `Ready: ${selectedFile.name}`;
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'inline-block';
                    saveButton.style.display = 'inline-block';
                }
                reader.readAsDataURL(selectedFile);
            }
        });

        async function saveToCloud() {
            if (!selectedFile) return;
            statusMessage.textContent = "Uploading file...";
            statusMessage.style.color = "orange";

            const fileExtension = selectedFile.name.split('.').pop();
            const uniqueFileName = `${Date.now()}.${fileExtension}`;

            try {
                const response = await fetch(`${SUPABASE_URL}/storage/v1/object/uploads/${uniqueFileName}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': selectedFile.type
                    },
                    body: selectedFile
                });

                if (response.ok) {
                    statusMessage.textContent = "✅ Saved successfully to the cloud!";
                    statusMessage.style.color = "green";
                    saveButton.style.display = 'none';
                } else {
                    const errData = await response.json();
                    throw new Error(errData.message || "Upload failed");
                }
            } catch (error) {
                statusMessage.textContent = `❌ Error: ${error.message}`;
                statusMessage.style.color = "red";
            }
        }
    </script>
</body>
</html>
