    <!-- 1. Include Firebase SDK Modules via CDN -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://gstatic.com";

        // 2. Your Web App's Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD3w7D_HHL8aOos41gZkg0FUp8svK5Zhbo",
            authDomain: "set-up-d1a2d.firebaseapp.com",
            databaseURL: "https://set-up-d1a2d-default-rtdb.firebaseio.com",
            projectId: "set-up-d1a2d",
            storageBucket: "set-up-d1a2d.firebasestorage.app",
            messagingSenderId: "981914259015",
            appId: "1:981914259015:web:4451f07d7bce804008ab62",
            measurementId: "G-8HCM7P1NX3"
        };

        // 3. Initialize Firebase & Storage Link
        const app = initializeApp(firebaseConfig);
        const storage = getStorage(app);

        // DOM Elements references setup
        const filePicker = document.getElementById('filePicker');
        const textNoteInput = document.getElementById('textNoteInput');
        const wordCountDisplay = document.getElementById('wordCount');
        const charCountDisplay = document.getElementById('charCount');
        const imagePreview = document.getElementById('image-preview');
        const docIcon = document.getElementById('doc-icon');
        const fileInfo = document.getElementById('file-info');
        const saveButton = document.getElementById('saveButton');
        const statusMessage = document.getElementById('status-message');
        const themeButton = document.getElementById('themeButton');

        // Global variable to store the file currently staged for upload
        let stagedFile = null;

        // Dark Mode Theme Toggle
        themeButton.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        });

        // Click handler to open hidden native file picker
        window.triggerUpload = function() {
            filePicker.click();
        }

        // Monitor File Input changes (Option 1)
        filePicker.addEventListener('change', (e) => {
            const files = e.target.files;
            if (files && files.length > 0) {
                stageFileForUpload(files[0]);
            }
        });

        // Word & Character Counter
        textNoteInput.addEventListener('input', () => {
            const text = textNoteInput.value.trim();
            const words = text === '' ? 0 : text.split(/\s+/).length;
            const characters = text.length;

            wordCountDisplay.textContent = `Words: ${words}`;
            charCountDisplay.textContent = `Characters: ${characters}`;
        });

        // Convert Written Text into a downloadable Text File (Option 2)
        window.prepareTextNote = function() {
            const text = textNoteInput.value.trim();
            if (!text) {
                alert('Please write some text before preparing the note.');
                return;
            }

            // Create a virtual file snippet from the textarea string
            const blob = new Blob([text], { type: 'text/plain' });
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            const virtualFile = new File([blob], `note-${timestamp}.txt`, { type: 'text/plain' });

            stageFileForUpload(virtualFile);
            statusMessage.textContent = "Text note successfully prepared!";
            statusMessage.style.color = "#2ecc71";
        }

        // UI Render Manager for Staged Assets
        function stageFileForUpload(file) {
            stagedFile = file;
            
            // Reset views
            imagePreview.style.display = 'none';
            docIcon.style.display = 'none';
            statusMessage.textContent = '';

            // Update text meta descriptions
            const fileSizeKB = (file.size / 1024).toFixed(2);
            fileInfo.innerHTML = `Staged File: <strong>${file.name}</strong> (${fileSizeKB} KB)`;

            // Check if file is an image to show preview, else show document icon
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'inline-block';
                };
                reader.readAsDataURL(file);
            } else {
                docIcon.style.display = 'block';
            }

            // Make the universal upload save button visible
            saveButton.style.display = 'inline-block';
            saveButton.disabled = false;
        }

        // 4. Live Firebase Cloud Storage Upload Logic
        window.saveToCloud = async function() {
            if (!stagedFile) {
                alert('No file staged for upload.');
                return;
            }

            statusMessage.textContent = "Uploading to Firebase Storage...";
            statusMessage.style.color = "var(--accent-color)";
            saveButton.disabled = true;

            try {
                // Create a unique storage reference location path inside Firebase
                const storageRef = ref(storage, 'uploads/' + stagedFile.name);
                
                // Upload file bytes directly to the cloud path bucket
                const snapshot = await uploadBytes(storageRef, stagedFile);
                
                // Optional: Get the permanent public link
                const downloadURL = await getDownloadURL(snapshot.ref);

                statusMessage.textContent = `🚀 Success! Saved permanently to the cloud.`;
                statusMessage.style.color = "#2ecc71";
                
                // Clear state after success
                stagedFile = null;
                saveButton.style.display = 'none';
                textNoteInput.value = '';
                wordCountDisplay.textContent = 'Words: 0';
                charCountDisplay.textContent = 'Characters: 0';
            } catch (error) {
                console.error(error);
                statusMessage.textContent = `❌ Upload failed: ${error.message}`;
                statusMessage.style.color = "#e74c3c";
                saveButton.disabled = false;
            }
        }
    </script>
</body>
</html>
