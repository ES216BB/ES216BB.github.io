<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Asset Stager</title>
    <style>
        :root {
            --bg-color: #f5f6fa;
            --card-color: #ffffff;
            --text-color: #2f3640;
            --accent-color: #3498db;
            --border-color: #dcdde1;
        }
        [data-theme="dark"] {
            --bg-color: #1e272e;
            --card-color: #2f3640;
            --text-color: #f5f6fa;
            --border-color: #485460;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 120px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            background: var(--bg-color);
            color: var(--text-color);
            resize: none;
            font-size: 14px;
        }
        .counter-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-top: 5px;
            color: #7f8c8d;
        }
        .button-group {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: var(--accent-color); color: white; }
        .btn-secondary { background: #7f8c8d; color: white; }
        .btn-theme { background: transparent; border: 1px solid var(--border-color); color: var(--text-color); }

        #filePicker { display: none; }

        .preview-zone {
            margin-top: 20px;
            text-align: center;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 15px;
            background: var(--bg-color);
        }
        #image-preview {
            max-width: 100%;
            max-height: 150px;
            border-radius: 6px;
            display: none;
        }
        #doc-icon {
            font-size: 48px;
            display: none;
        }
        #status-message {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>Cloud Asset Stager</h2>
            <button class="btn-theme" id="themeButton">🌓 Theme</button>
        </div>

        <!-- Text Workspace -->
        <textarea id="textNoteInput" placeholder="Type or paste your notes here..."></textarea>
        <div class="counter-row">
            <span id="wordCount">Words: 0</span>
            <span id="charCount">Characters: 0</span>
        </div>

        <div class="button-group">
            <button class="btn-secondary" onclick="prepareTextNote()">📝 Stage Written Text</button>
            <button class="btn-secondary" onclick="triggerUpload()">📎 Choose External File</button>
        </div>

        <!-- Hidden Native File Input -->
        <input type="file" id="filePicker">

        <!-- Asset Preview Window -->
        <div class="preview-zone">
            <div id="doc-icon">📄</div>
            <img id="image-preview" alt="Upload preview">
            <p id="file-info" style="font-size: 13px; margin: 10px 0 0 0;">No file currently staged.</p>
        </div>

        <!-- Cloud Submission -->
        <div style="margin-top: 20px; text-align: center;">
            <button id="saveButton" class="btn-primary" style="display: none; width: 100%; padding: 12px;" onclick="saveToCloud()">
                ☁️ Save Asset to Cloud Storage & DB
            </button>
        </div>

        <div id="status-message"></div>
    </div>

    <!-- Firebase Core, Storage, and Realtime Database Modules via CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
        import { getDatabase, ref as dbRef, push, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD3w7D_HHL8aOos41gZkg0FUp8svK5Zhbo",
            authDomain: "set-up-d1a2d.firebaseapp.com",
            databaseURL: "https://set-up-d1a2d-default-rtdb.firebaseio.com",
            projectId: "set-up-d1a2d",
            storageBucket: "set-up-d1a2d.firebasestorage.app",
            messagingSenderId: "981914259015",
            appId: "1:981914259015:web:4451f07d7bce804008ab62",
            measurementId: "G-8HCM7P1NX3"
        };

        const app = initializeApp(firebaseConfig);
        const storage = getStorage(app);
        const database = getDatabase(app);

        const filePicker = document.getElementById('filePicker');
        const textNoteInput = document.getElementById('textNoteInput');
        const wordCountDisplay = document.getElementById('wordCount');
        const charCountDisplay = document.getElementById('charCount');
        const imagePreview = document.getElementById('image-preview');
        const docIcon = document.getElementById('doc-icon');
        const fileInfo = document.getElementById('file-info');
        const saveButton = document.getElementById('saveButton');
        const statusMessage = document.getElementById('status-message');
        const themeButton = document.getElementById('themeButton');

        let stagedFile = null;

        // --- EXPIRATION STORAGE CORE LOGIC ---
        const STORAGE_KEY = "staged_cpp_code";
        const TWO_HOURS_MS = 2 * 60 * 60 * 1000;

        function updateMetrics() {
            const text = textNoteInput.value.trim();
            const words = text === '' ? 0 : text.split(/\s+/).length;
            wordCountDisplay.textContent = `Words: ${words}`;
            charCountDisplay.textContent = `Characters: ${text.length}`;
        }

        // Check if there's unexpired code saved in local storage on page load
        function checkAndLoadSavedCode() {
            const savedItemStr = localStorage.getItem(STORAGE_KEY);
            if (!savedItemStr) return;

            try {
                const item = JSON.parse(savedItemStr);
                const now = new Date().getTime();

                if (now > item.expiry) {
                    localStorage.removeItem(STORAGE_KEY);
                } else {
                    textNoteInput.value = item.value;
                    updateMetrics();
                    statusMessage.textContent = "🔄 Restored unsaved C++ code from local cache.";
                    statusMessage.style.color = "var(--accent-color)";
                    setTimeout(() => { statusMessage.textContent = ""; }, 4000);
                }
            } catch (e) {
                console.error("Error reading from local storage:", e);
            }
        }

        // Run recovery check instantly on boot
        checkAndLoadSavedCode();

        // Modifying your staging logic to commit to storage for 2 hours
        window.prepareTextNote = function() {
            const textData = textNoteInput.value;
            if (!textData.trim()) {
                statusMessage.textContent = "❌ Please enter some C++ code first.";
                statusMessage.style.color = "#e74c3c";
                return;
            }

            // Set the payload with a 2-hour stamp expiration
            const now = new Date().getTime();
            const storagePayload = {
                value: textData,
                expiry: now + TWO_HOURS_MS
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(storagePayload));

            // Setup preview zones
            imagePreview.style.display = 'none';
            docIcon.style.display = 'block';
            fileInfo.textContent = `Text note staged successfully (Saved locally for 2 hours).`;
            saveButton.style.display = 'block';
            
            statusMessage.textContent = "💾 Staged & cached successfully!";
            statusMessage.style.color = "#2ecc71";
        };

        // Theme switching handler
        themeButton.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        });

        window.triggerUpload = function() {
            filePicker.click();
        }

        filePicker.addEventListener('change', (e) => {
