    <!-- Include Firebase Core, Storage, and Realtime Database SDK Modules via CDN -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://gstatic.com";
        import { getDatabase, ref as dbRef, push, set } from "https://gstatic.com";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD3w7D_HHL8aOos41gZkg0FUp8svK5Zhbo",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebaseio.com",
            projectId: "set-up-d1a2d",
            storageBucket: "set-up-d1a2d.firebasestorage.app",
            messagingSenderId: "981914259015",
            appId: "1:981914259015:web:4451f07d7bce804008ab62",
            measurementId: "G-8HCM7P1NX3"
        };

        // Initialize Firebase services
        const app = initializeApp(firebaseConfig);
        const storage = getStorage(app);
        const database = getDatabase(app);

        // DOM Elements
        const filePicker = document.getElementById('filePicker');
        const textNoteInput = document.getElementById('textNoteInput');
        const wordCountDisplay = document.getElementById('wordCount');
        const charCountDisplay = document.getElementById('charCount');
        const imagePreview = document.getElementById('image-preview');
        const docIcon = document.getElementById('doc-icon');
        const fileInfo = document.getElementById('file-info');
        const saveButton = document.getElementById('saveButton');
        const statusMessage = document.getElementById('status-message');
        const themeButton = document.getElementById('themeButton');

        let stagedFile = null;

        // Theme Toggle
        themeButton.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        });

        // Open hidden file picker
        window.triggerUpload = function() {
            filePicker.click();
        }

        // Monitor File Input changes
        filePicker.addEventListener('change', (e) => {
            const files = e.target.files;
            if (files && files.length > 0) {
                stageFileForUpload(files[0]); // Explicitly pass the single file object
            }
        });

        // Word & Character Counter
        textNoteInput.addEventListener('input', () => {
            const text = textNoteInput.value.trim();
            const words = text === '' ? 0 : text.split(/\s+/).length;
            const characters = text.length;

            wordCountDisplay.textContent = `Words: ${words}`;
            charCountDisplay.textContent = `Characters: ${characters}`;
        });

        // Convert Written Text into a file object
        window.prepareTextNote = function() {
            const text = textNoteInput.value.trim();
            if (!text) {
                alert('Please write some text before preparing the note.');
                return;
            }

            const blob = new Blob([text], { type: 'text/plain' });
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            const virtualFile = new File([blob], `note-${timestamp}.txt`, { type: 'text/plain' });

            stageFileForUpload(virtualFile);
            statusMessage.textContent = "Text note successfully prepared!";
            statusMessage.style.color = "#2ecc71";
        }

        // UI Manager for Staged Assets
        function stageFileForUpload(file) {
            stagedFile = file;
            
            imagePreview.style.display = 'none';
            docIcon.style.display = 'none';
            statusMessage.textContent = '';

            const fileSizeKB = (file.size / 1024).toFixed(2);
            fileInfo.innerHTML = `Staged File: <strong>${file.name}</strong> (${fileSizeKB} KB)`;

            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'inline-block';
                };
                reader.readAsDataURL(file);
            } else {
                docIcon.style.display = 'block';
            }

            saveButton.style.display = 'inline-block';
            saveButton.disabled = false;
        }

        // Live Cloud Storage + Database Upload Logic
        window.saveToCloud = async function() {
            if (!stagedFile) {
                alert('No file staged for upload.');
                return;
            }

            statusMessage.textContent = "Uploading asset to storage...";
            statusMessage.style.color = "var(--accent-color)";
            saveButton.disabled = true;

            try {
                // 1. Upload to Storage
                const uniqueFileName = Date.now() + '_' + stagedFile.name;
                const fileStorageRef = storageRef(storage, 'uploads/' + uniqueFileName);
                const snapshot = await uploadBytes(fileStorageRef, stagedFile);
                
                // 2. Fetch URL
                const downloadURL = await getDownloadURL(snapshot.ref);

                // 3. Write to Realtime Database
                statusMessage.textContent = "Saving file details to Database...";
                const dbUploadsFolder = dbRef(database, 'fileLogs');
                const newRecordRef = push(dbUploadsFolder);
                
                await set(newRecordRef, {
                    fileName: stagedFile.name,
                    fileSizeKB: (stagedFile.size / 1024).toFixed(2),
                    fileType: stagedFile.type,
                    uploadedAt: new Date().toISOString(),
                    fileUrl: downloadURL
                });

                statusMessage.textContent = `🚀 Success! "${stagedFile.name}" stored and logged.`;
                statusMessage.style.color = "#2ecc71";
                
                // Reset State
                stagedFile = null;
                saveButton.style.display = 'none';
                textNoteInput.value = '';
                wordCountDisplay.textContent = 'Words: 0';
                charCountDisplay.textContent = 'Characters: 0';
            } catch (error) {
                console.error("Upload error details:", error);
                statusMessage.textContent = `❌ Error: ${error.message}`;
                statusMessage.style.color = "#e74c3c";
                saveButton.disabled = false;
            }
        }
    </script>
</body>
</html>
