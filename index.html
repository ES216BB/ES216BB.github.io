<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website - Document Cloud Save</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --accent-color: #4a90e2;
            --card-bg: #ffffff;
        }
        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #f4f7f6;
            --accent-color: #357abd;
            --card-bg: #2a2a2a;
        }
        body { font-family: system-ui, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; }
        header, main { max-width: 800px; margin: 0 auto; padding: 2rem 1rem; }
        .profile-card { background-color: var(--card-bg); padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 2rem; }
        .upload-container { border: 3px dashed var(--accent-color); padding: 2rem; text-align: center; border-radius: 8px; background-color: rgba(74, 144, 226, 0.05); cursor: pointer; }
        .file-input { display: none; }
        #preview-container { margin-top: 1.5rem; text-align: center; }
        #image-preview { max-width: 100%; max-height: 300px; border-radius: 8px; display: none; }
        #doc-icon { font-size: 4rem; display: none; margin-bottom: 0.5rem; }
        .btn { background-color: #2ecc71; color: white; border: none; padding: 0.7rem 1.5rem; border-radius: 20px; cursor: pointer; font-weight: bold; margin-top: 1rem; display: none; }
        #status-message { margin-top: 1rem; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div><strong>MySpace Storage</strong></div>
    </header>

    <main>
        <section class="profile-card">
            <h1>Upload Documents & Files 📁</h1>
            <p>Upload images or documents (.pdf, .docx, .txt) and click save to permanently store them in Supabase.</p>
            
            <div class="upload-container" onclick="triggerUpload()">
                <p>Click to browse and choose any document or image file</p>
                <input type="file" id="filePicker" class="file-input">
            </div>

            <div id="preview-container">
                <div id="doc-icon">📄</div>
                <p id="file-info"></p>
                <img id="image-preview" src="#" alt="Preview">
                <br>
                <button id="saveButton" class="btn" onclick="saveToCloud()">Save Permanently</button>
                <p id="status-message"></p>
            </div>
        </section>
    </main>

    <script>
        const filePicker = document.getElementById('filePicker');
        const imagePreview = document.getElementById('image-preview');
        const docIcon = document.getElementById('doc-icon');
        const fileInfo = document.getElementById('file-info');
        const saveButton = document.getElementById('saveButton');
        const statusMessage = document.getElementById('status-message');
        let selectedFile = null;

        const SUPABASE_URL = "https://supabase.co"; 
        const SUPABASE_ANON_KEY = "eu-central-1"; // <-- PASTE YOUR ANON KEY HERE

        function triggerUpload() {
            filePicker.click();
        }

        filePicker.addEventListener('change', function(event) {
            if (event.target.files.length > 0) {
                selectedFile = event.target.files[0];
                fileInfo.textContent = `Ready: ${selectedFile.name} (${(selectedFile.size / 1024).toFixed(1)} KB)`;
                saveButton.style.display = 'inline-block';
                statusMessage.textContent = ""; 

                if (selectedFile.type.startsWith('image/')) {
                    docIcon.style.display = 'none';
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        imagePreview.src = e.target.result;
                        imagePreview.style.display = 'inline-block';
                    }
                    reader.readAsDataURL(selectedFile);
                } else {
                    imagePreview.style.display = 'none';
                    docIcon.style.display = 'block';
                }
            }
        });

        async function saveToCloud() {
            if (!selectedFile) return;
            statusMessage.textContent = "Uploading file to Supabase...";
            statusMessage.style.color = "orange";

            const fileExtension = selectedFile.name.split('.').pop();
            const uniqueFileName = `${Date.now()}.${fileExtension}`;

            try {
                // Fixed routing endpoint to bypass strict browser restrictions
                const response = await fetch(`${SUPABASE_URL}/storage/v1/object/public/uploads/${uniqueFileName}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': selectedFile.type || 'application/octet-stream'
                    },
                    body: selectedFile
                });

                if (response.ok || response.status === 200) {
                    statusMessage.textContent = "✅ File saved successfully to your cloud bucket!";
                    statusMessage.style.color = "green";
                    saveButton.style.display = 'none';
                } else {
                    const errData = await response.json();
                    throw new Error(errData.message || `Upload failed (Status: ${response.status})`);
                }
            } catch (error) {
                statusMessage.textContent = `❌ Error: ${error.message}`;
                statusMessage.style.color = "red";
            }
        }
    </script>
</body>
</html>
